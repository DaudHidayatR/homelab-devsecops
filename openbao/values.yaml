# OpenBao Helm chart values — fresh single-node raft
# Fresh install only, no migration
# Chart repo: openbao/openbao

global:
  tlsDisable: true

injector:
  enabled: false

csi:
  enabled: false

server:
  image:
    tag: "2.5.2"

  updateStrategyType: RollingUpdate

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  ingress:
    enabled: false

  readinessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
    port: 8200
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 12
    timeoutSeconds: 3

  livenessProbe:
    enabled: false

  dataStorage:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce

  auditStorage:
    enabled: false

  standalone:
    enabled: false

  ha:
    enabled: true
    replicas: 1

    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true
        disable_mlock = true

        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }

        storage "raft" {
          path = "/openbao/data"
        }

ui:
  enabled: false