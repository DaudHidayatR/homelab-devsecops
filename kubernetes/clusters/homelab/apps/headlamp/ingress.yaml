apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp-tailnet
  namespace: headlamp
  annotations:
    # Tailscale provides private HTTPS at headlamp.<tailnet>.ts.net.
    tailscale.com/hostname: headlamp
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headlamp
                port:
                  number: 80
