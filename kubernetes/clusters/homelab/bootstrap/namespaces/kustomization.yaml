apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - demo.yaml
  - openbao.yaml
  - istio-system.yaml
  - headlamp.yaml
  - tailscale.yaml

patches:
  - target:
      kind: Namespace
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: not-important
        labels:
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/warn: restricted
