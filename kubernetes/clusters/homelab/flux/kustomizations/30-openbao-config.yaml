apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao-config
  namespace: flux-system
spec:
  interval: 30m
  path: ./kubernetes/clusters/homelab/platform/openbao/configuration
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: platform
