apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openbao-tailnet
  namespace: openbao
  annotations:
    # Tailscale terminates HTTPS at the tailnet boundary and forwards every
    # OpenBao UI and API path to the in-cluster HTTP service.
    # Generated hostname: openbao-openbao-tailnet-ingress.<tailnet>.ts.net.
spec:
  ingressClassName: tailscale
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openbao
                port:
                  number: 8200
