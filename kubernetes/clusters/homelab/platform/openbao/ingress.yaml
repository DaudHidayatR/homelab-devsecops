apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openbao-tailnet
  namespace: openbao
  annotations:
    # Tailscale provides private HTTPS at openbao.<tailnet>.ts.net.
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - openbao
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openbao
                port:
                  number: 8200
