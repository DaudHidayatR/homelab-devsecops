apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 30m
  timeout: 10m
  # Wait for the chart rollout. The OpenBao readiness probe accepts sealed and
  # uninitialized states, so Flux can still progress on first install while
  # preserving normal Helm rollout ordering for this foundational service.
  chart:
    spec:
      chart: openbao
      version: "0.26.2"
      sourceRef:
        kind: HelmRepository
        name: openbao
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: openbao-values
      valuesKey: values.yaml
