apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: openbao-policy-sources
    namespace: openbao
    files:
      - policies/platform/system-admin.hcl
      - policies/platform/audit-metadata-reader.hcl
      - policies/platform/secret-kv-admin.hcl
      - policies/platform/shared-read-public.hcl
      - policies/platform/user-default.hcl
      - policies/platform/user-ssh.hcl
      - policies/apps/app-default.hcl
      - policies/apps/app-demo.hcl
      - policies/apps/app-tailscale-operator.hcl
      - policies/apps/ci-deployer.hcl
