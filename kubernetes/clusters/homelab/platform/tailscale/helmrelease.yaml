apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  # Architecture audit v2 remediation (2026-08-31): the Tailscale operator is
  # owned by Flux. The shell layer never applies upstream operator manifests
  # and never patches the deployment; it only verifies this HelmRelease and
  # waits for the rollout (scripts/lib/tailscale.sh).
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 30m
  timeout: 10m
  dependsOn:
    - name: openbao
      namespace: openbao
  chart:
    spec:
      # Pinned for reproducible deployments. Upstream contract at this
      # version: when values.oauth is unset the chart mounts a pre-created
      # Secret named operator-oauth via CLIENT_ID_FILE/CLIENT_SECRET_FILE.
      chart: tailscale-operator
      version: "1.102.3"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: tailscale-operator-values
      valuesKey: values.yaml
