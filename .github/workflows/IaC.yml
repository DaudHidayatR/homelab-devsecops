---
name: IaC Security Pipeline

on:
  push:
    branches: [main, master]
    paths:
      - "**.tf"
      - "**.yaml"
      - "**.yml"
      - "kustomization.*"
      - "Dockerfile*"
  pull_request:
    branches: [main, master]
    paths:
      - "**.tf"
      - "**.yaml"
      - "**.yml"
      - "kustomization.*"
      - "Dockerfile*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  security-events: write

env:
  TRIVY_IMAGE: docker.io/aquasec/trivy:0.61.0
  GITLEAKS_IMAGE: docker.io/zricethezav/gitleaks:v8.24.0
  TFLINT_VERSION: v0.55.1
  CHECKOV_VERSION: 3.2.414
  KYVERNO_IMAGE: ghcr.io/kyverno/kyverno-cli:v1.13.0
  CONFTEST_IMAGE: docker.io/openpolicyagent/conftest:v0.56.0
  KUSTOMIZE_IMAGE: registry.k8s.io/kustomize/kustomize:v5.6.0
  SEVERITY: HIGH,CRITICAL

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ] || [ "$GITHUB_REF_NAME" = "master" ]; then
            SKIP=no-commit-to-branch pre-commit run --all-files
          else
            pre-commit run --all-files
          fi
      - name: Terraform fmt
        if: hashFiles('**/*.tf') != ''
        run: terraform fmt -check -recursive
      - name: Install TFLint
        if: hashFiles('**/*.tf') != ''
        run: |
          curl -sLo tflint.zip \
            "https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}/tflint_linux_amd64.zip"
          unzip tflint.zip -d /usr/local/bin/
          rm -f tflint.zip
      - name: TFLint
        if: hashFiles('**/*.tf') != ''
        run: |
          tflint --init
          tflint -f compact

  secrets:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: GitLeaks scan
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" "$GITLEAKS_IMAGE" \
            detect --source /src --report-format json \
            --report-path /src/gitleaks-report.json -v
      - name: Validate report
        run: |
          if [ ! -s "gitleaks-report.json" ]; then
            echo "ERROR: gitleaks-report.json is missing or empty"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30

  misconfig:
    name: Misconfiguration Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config scan
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" \
            config --severity "$SEVERITY" --format sarif \
            --output trivy-config-report.sarif /src
      - name: Checkov scan
        continue-on-error: true
        run: |
          pip install "checkov==${CHECKOV_VERSION}"
          checkov -d . --framework terraform,kubernetes,dockerfile,yaml \
            --soft-fail --output sarif --output-file-path checkov-report.sarif
      - name: Validate reports
        run: |
          missing=0
          for f in trivy-config-report.sarif checkov-report.sarif; do
            if [ ! -s "$f" ]; then
              echo "ERROR: $f is missing or empty"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            exit 1
          fi
      - uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        if: always()
        with:
          sarif_file: trivy-config-report.sarif
      - uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        if: always()
        with:
          sarif_file: checkov-report.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iac-reports
          path: |
            trivy-config-report.sarif
            checkov-report.sarif
          retention-days: 30

  policy:
    name: Policy Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Render Kustomize manifests
        id: kustomize
        run: |
          mkdir -p rendered-manifests
          rendered=0
          for overlay in clusters/kind infrastructure apps .; do
            if [ -f "$overlay/kustomization.yaml" ] || \
               [ -f "$overlay/kustomization.yml" ] || \
               [ -f "$overlay/Kustomization" ]; then
              safe_name="$(printf '%s' "$overlay" | sed 's#[/.]#-#g; s#^-#root#')"
              docker run --rm -v "$PWD:/src" -w /src "$KUSTOMIZE_IMAGE" \
                build "/src/$overlay" > "rendered-manifests/${safe_name}.yaml"
              rendered=$((rendered + 1))
            fi
          done
          if [ "$rendered" -gt 0 ]; then
            cat rendered-manifests/*.yaml > rendered-manifests.yaml
            echo "has_manifests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_manifests=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Conftest
        if: steps.kustomize.outputs.has_manifests == 'true' && hashFiles('policies/') != ''
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$CONFTEST_IMAGE" test --policy /src/policies/ /src/rendered-manifests/
      - name: Kyverno policy check
        if: steps.kustomize.outputs.has_manifests == 'true' && hashFiles('policies/') != ''
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$KYVERNO_IMAGE" \
            apply /src/policies/ --resource /src/rendered-manifests.yaml || true

  deploy:
    name: Deploy (Flux reconcile via Tailscale)
    runs-on: ubuntu-latest
    needs: [lint, secrets, misconfig, policy]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@main
        with:
          version: 'latest'

      - name: Verify Flux CLI
        run: flux version --client

      - name: Setup kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Verify cluster connectivity
        run: kubectl cluster-info

      - name: Install Flux controllers if missing
        run: |
          if ! kubectl get crd gitrepositories.source.toolkit.fluxcd.io >/dev/null 2>&1; then
            echo "Flux CRDs not found. Installing Flux controllers..."
            flux install
          else
            echo "Flux CRDs already installed."
          fi
          kubectl wait --for=condition=Available deployment/source-controller -n flux-system --timeout=180s
          kubectl wait --for=condition=Available deployment/kustomize-controller -n flux-system --timeout=180s
          kubectl wait --for=condition=Available deployment/helm-controller -n flux-system --timeout=180s

      - name: Ensure Flux Git source and kustomizations
        run: |
          flux create source git flux-system \
            --url=https://github.com/${{ github.repository }}.git \
            --branch=main \
            --interval=1m \
            --export | kubectl apply -f -

          kubectl apply -k clusters/kind

      - name: Reconcile Flux sources
        run: flux reconcile source git flux-system --timeout=5m

      - name: Reconcile infrastructure
        run: flux reconcile kustomization infrastructure --timeout=10m

      - name: Ensure RabbitMQ credentials secret
        env:
          RABBITMQ_DEFAULT_PASS: ${{ secrets.RABBITMQ_DEFAULT_PASS }}
        run: |
          if kubectl get secret rabbitmq-credentials -n messaging >/dev/null 2>&1; then
            echo "RabbitMQ credentials secret already exists."
            exit 0
          fi

          password="${RABBITMQ_DEFAULT_PASS:-}"
          if [ -z "$password" ]; then
            password="$(openssl rand -base64 32 | tr -d '\n')"
          fi

          kubectl create secret generic rabbitmq-credentials \
            --namespace=messaging \
            --from-literal=RABBITMQ_DEFAULT_USER=admin \
            --from-literal=RABBITMQ_DEFAULT_PASS="$password"

      - name: Reconcile apps
        run: flux reconcile kustomization apps --timeout=10m

      - name: Debug apps reconciliation failure
        if: failure()
        run: |
          echo "=== Flux Kustomizations ==="
          flux get kustomizations -A || true

          echo ""
          echo "=== Apps Kustomization ==="
          kubectl describe kustomization apps -n flux-system || true

          echo ""
          echo "=== App Deployments ==="
          kubectl get deployments -A || true

          echo ""
          echo "=== Demo Pods ==="
          kubectl get pods -n demo -o wide || true
          kubectl describe pods -n demo || true

          echo ""
          echo "=== RabbitMQ Pods ==="
          kubectl get pods -n messaging -o wide || true
          kubectl describe pods -n messaging || true

          echo ""
          echo "=== Headlamp Pods ==="
          kubectl get pods -n kube-system -l k8s-app=headlamp -o wide || true
          kubectl describe pods -n kube-system -l k8s-app=headlamp || true

          echo ""
          echo "=== Recent Events ==="
          kubectl get events -A --sort-by=.lastTimestamp || true

      - name: Smoke test
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -A
          echo ""
          echo "=== Flux Resources ==="
          flux get all
