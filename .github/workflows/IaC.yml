---
name: IaC Security Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - "**.tf"
      - "**.yaml"
      - "**.yml"
      - "**.sh"
      - "scripts/**"
      - "kustomization.*"
      - "Dockerfile*"
      - ".github/workflows/**"
      - "**.hcl"
      - "**.rego"
      - "Makefile"
      - "**/Makefile"
      - "config.env.example"
      - ".trivyignore"
  pull_request:
    branches: [main]
    paths:
      - "**.tf"
      - "**.yaml"
      - "**.yml"
      - "**.sh"
      - "scripts/**"
      - "kustomization.*"
      - "Dockerfile*"
      - ".github/workflows/**"
      - "**.hcl"
      - "**.rego"
      - "Makefile"
      - "**/Makefile"
      - "config.env.example"
      - ".trivyignore"

concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/v') && 'production' || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  security-events: write

env:
  TRIVY_IMAGE: docker.io/aquasec/trivy:0.61.0
  GITLEAKS_IMAGE: docker.io/zricethezav/gitleaks:v8.24.0
  TFLINT_VERSION: v0.55.1
  CHECKOV_VERSION: 3.2.414
  KYVERNO_IMAGE: ghcr.io/kyverno/kyverno-cli:v1.13.0
  CONFTEST_IMAGE: docker.io/openpolicyagent/conftest:v0.56.0
  KUSTOMIZE_IMAGE: registry.k8s.io/kustomize/kustomize:v5.6.0
  SEVERITY: HIGH,CRITICAL

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ] ; then
            SKIP=no-commit-to-branch pre-commit run --all-files
          else
            pre-commit run --all-files
          fi
      - name: Terraform fmt
        if: hashFiles('**/*.tf') != ''
        run: terraform fmt -check -recursive
      - name: Install TFLint
        if: hashFiles('**/*.tf') != ''
        run: |
          curl -sLo tflint.zip \
            "https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}/tflint_linux_amd64.zip"
          unzip tflint.zip -d /usr/local/bin/
          rm -f tflint.zip
      - name: TFLint
        if: hashFiles('**/*.tf') != ''
        run: |
          tflint --init
          tflint -f compact
      - name: OpenBao Raft path vs PVC mount
        run: python3 scripts/check_openbao_raft_path.py

  secrets:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: GitLeaks scan
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" "$GITLEAKS_IMAGE" \
            detect --source /src --report-format json \
            --report-path /src/gitleaks-report.json -v
      - name: Fail on GitLeaks findings
        if: always()
        run: python3 .github/scripts/fail-on-gitleaks.py gitleaks-report.json
      - name: Validate report
        run: |
          if [ ! -s "gitleaks-report.json" ]; then
            echo "ERROR: gitleaks-report.json is missing or empty"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30

  misconfig:
    name: Misconfiguration Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config scan
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE" \
            config --severity "$SEVERITY" --format sarif \
            --output trivy-config-report.sarif /src
      - name: Checkov scan
        continue-on-error: true
        run: |
          pip install "checkov==${CHECKOV_VERSION}"
          checkov -d . --framework terraform,kubernetes,dockerfile,yaml \
            --soft-fail --output sarif --output-file-path checkov-report.sarif
      - name: Validate reports
        run: |
          missing=0
          for f in trivy-config-report.sarif checkov-report.sarif; do
            if [ -d "$f" ]; then
              found=$(find "$f" -maxdepth 1 -name '*.sarif' -o -maxdepth 1 -name 'results_*.json' | head -1)
              if [ -z "$found" ]; then
                echo "ERROR: no SARIF output inside $f"
                missing=$((missing + 1))
              fi
            elif [ ! -s "$f" ]; then
              echo "ERROR: $f is missing or empty"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            exit 1
          fi
      - name: Fail on HIGH/CRITICAL misconfigurations
        if: always()
        run: |
          python3 .github/scripts/fail-on-sarif.py \
            trivy-config-report.sarif checkov-report.sarif
      - uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        if: always()
        with:
          sarif_file: trivy-config-report.sarif
      - uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        if: always()
        with:
          sarif_file: checkov-report.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iac-reports
          path: |
            trivy-config-report.sarif
            checkov-report.sarif
          retention-days: 30

  policy:
    name: Policy Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Render Kustomize manifests
        id: kustomize
        run: |
          mkdir -p rendered-manifests
          rendered=0
          for overlay in \
            kubernetes/clusters/homelab/bootstrap \
            kubernetes/clusters/homelab/cluster-resources \
            kubernetes/clusters/homelab/platform \
            kubernetes/clusters/homelab/cluster-policies \
            kubernetes/clusters/homelab/operations \
            kubernetes/clusters/homelab/apps \
            kubernetes/clusters/homelab/flux \
            kubernetes/clusters/homelab; do
            if [ -f "$overlay/kustomization.yaml" ] || \
               [ -f "$overlay/kustomization.yml" ] || \
               [ -f "$overlay/Kustomization" ]; then
              safe_name="$(printf '%s' "$overlay" | sed 's#[/.]#-#g; s#^-#root#')"
              docker run --rm -v "$PWD:/src" -w /src "$KUSTOMIZE_IMAGE" \
                build "/src/$overlay" > "rendered-manifests/${safe_name}.yaml"
              rendered=$((rendered + 1))
            fi
          done
          if [ "$rendered" -gt 0 ]; then
            cat rendered-manifests/*.yaml > rendered-manifests.yaml
            echo "has_manifests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_manifests=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Conftest
        if: >-
          steps.kustomize.outputs.has_manifests == 'true' &&
          hashFiles('kubernetes/clusters/homelab/cluster-policies/**/*.rego') != ''
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$CONFTEST_IMAGE" test \
            --policy /src/kubernetes/clusters/homelab/cluster-policies/ /src/rendered-manifests/
      - name: Kyverno policy check
        if: >-
          steps.kustomize.outputs.has_manifests == 'true' &&
          hashFiles('kubernetes/clusters/homelab/cluster-policies/**/*.yaml') != ''
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$KYVERNO_IMAGE" \
            apply /src/kubernetes/clusters/homelab/cluster-policies/ --resource /src/rendered-manifests.yaml

  deploy:
    name: Deploy (Flux reconcile via Tailscale)
    runs-on: ubuntu-latest
    needs: [lint, secrets, misconfig, policy]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate Tailscale auth key
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          case "$TS_AUTHKEY" in
            tskey-auth-*) ;;
            *)
              echo "ERROR: production TS_AUTHKEY must be a pre-signed Tailscale auth key (tskey-auth-...)."
              exit 1
              ;;
          esac

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          # Tailnet Lock requires an ephemeral reusable pre-signed auth key.
          # TS_AUTHKEY must start with tskey-auth-, never an API key (ks...).
          authkey: ${{ secrets.TS_AUTHKEY }}
          statedir: ${{ runner.temp }}/tailscale-state

      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@main
        with:
          version: 'latest'

      - name: Verify Flux CLI
        run: flux version --client

      - name: Setup kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Verify cluster connectivity
        run: |
          status="$(tailscale status)"
          printf '%s\n' "$status"
          if tailscale status --json | python3 -c \
            'import json,sys; health=json.load(sys.stdin).get("Health", []);' \
            'sys.exit(not any("locked out" in message for message in health))'; then
            echo "ERROR: the GitHub runner is locked out by Tailnet Lock."
            echo "Replace TS_AUTHKEY with the output of 'tailscale lock sign <unsigned-auth-key>'."
            exit 1
          fi
          server="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          host_port="${server#https://}"
          host="${host_port%:*}"
          port="${host_port##*:}"
          echo "Kubernetes API endpoint: ${host}:${port}"
          tailscale ping --until-direct=false --c=1 --timeout=10s "${host}"
          timeout 10 bash -c "</dev/tcp/${host}/${port}" || {
            echo "ERROR: ${host}:${port} is not reachable over the tailnet."
            echo "Verify the VPS Tailscale IP and ACL/Tailnet Lock approval."
            echo "Recreate kind with TAILSCALE_VPS_IP so port 6443 binds to tailscale0."
            exit 1
          }
          kubectl cluster-info --request-timeout=10s

      - name: Install Flux controllers and source
        env:
          REPOSITORY_URL: https://github.com/${{ github.repository }}.git
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if ! kubectl get crd gitrepositories.source.toolkit.fluxcd.io >/dev/null 2>&1; then
            echo "Flux CRDs not found. Installing Flux controllers..."
            flux install
          else
            echo "Flux CRDs already installed."
          fi
          kubectl wait --for=condition=Available deployment/source-controller -n flux-system --timeout=180s
          kubectl wait --for=condition=Available deployment/kustomize-controller -n flux-system --timeout=180s
          kubectl wait --for=condition=Available deployment/helm-controller -n flux-system --timeout=180s

          # A production tag selects one immutable release. Flux remains the
          # deployment owner; CI only converges its source and reconciles it.
          kubectl apply -f - <<EOF
          apiVersion: source.toolkit.fluxcd.io/v1
          kind: GitRepository
          metadata:
            name: flux-system
            namespace: flux-system
          spec:
            interval: 1m
            url: ${REPOSITORY_URL}
            ref:
              tag: ${RELEASE_TAG}
          EOF
          kubectl wait gitrepository/flux-system -n flux-system --for=condition=Ready --timeout=5m
          revision="$(kubectl get gitrepository flux-system -n flux-system -o jsonpath='{.status.artifact.revision}')"
          case "$revision" in
            *"${RELEASE_SHA}"*) ;;
            *)
              echo "ERROR: Flux fetched '$revision', expected release ${RELEASE_TAG}@${RELEASE_SHA}."
              exit 1
              ;;
          esac

          # The repository is public, so the source is fetched unauthenticated
          # over HTTPS. Remove any stale token secret a previous deploy
          # persisted; the source above no longer references it (created
          # without secretRef), so no flux-system secret is required.
          if kubectl get secret flux-system -n flux-system >/dev/null 2>&1 && \
             ! kubectl get gitrepository flux-system -n flux-system \
               -o jsonpath='{.spec.secretRef.name}' 2>/dev/null | grep -qx flux-system; then
            kubectl delete secret flux-system -n flux-system --ignore-not-found
          fi

          kubectl apply -k kubernetes/clusters/homelab

      - name: Reconcile Flux sources
        run: flux reconcile source git flux-system --timeout=5m

      - name: Reconcile layered cluster state
        run: |
          for layer in bootstrap cluster-resources platform openbao-config cluster-policies operations apps; do
            flux reconcile kustomization "$layer" --timeout=10m
          done

      - name: Debug apps reconciliation failure
        if: failure()
        run: |
          echo "=== Flux Kustomizations ==="
          flux get kustomizations -A || true

          echo ""
          echo "=== Apps Kustomization ==="
          kubectl describe kustomization apps -n flux-system || true

          echo ""
          echo "=== App Deployments ==="
          kubectl get deployments -A || true

          echo ""
          echo "=== Demo Pods ==="
          kubectl get pods -n demo -o wide || true
          kubectl describe pods -n demo || true


          echo ""
          echo "=== Headlamp Pods ==="
          kubectl get pods -n kube-system -l k8s-app=headlamp -o wide || true
          kubectl describe pods -n kube-system -l k8s-app=headlamp || true

          echo ""
          echo "=== Recent Events ==="
          kubectl get events -A --sort-by=.lastTimestamp || true

      - name: Smoke test
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -A
          echo ""
          echo "=== Flux Resources ==="
          flux get all
