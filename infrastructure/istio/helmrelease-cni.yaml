apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-cni
  namespace: istio-system
spec:
  interval: 30m
  targetNamespace: kube-system
  dependsOn:
    - name: istio-base
  chart:
    spec:
      chart: cni
      version: "1.24.3"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  values:
    chained: true
    repair:
      enabled: true
