apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: istio-system
spec:
  interval: 30m
  dependsOn:
    - name: istio-base
    - name: istio-cni
  chart:
    spec:
      chart: istiod
      version: "1.24.3"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
  values:
    cni:
      enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
