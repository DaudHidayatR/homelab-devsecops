# NetworkPolicy: external-secrets default-deny ingress
# Blocks all incoming traffic to ESO pods.
# ESO makes outbound calls to OpenBao (within cluster) -- no ingress needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: external-secrets
spec:
  podSelector: {}
  policyTypes:
    - Ingress
