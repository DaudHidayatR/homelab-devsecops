---
# ExternalSecret: syncs OpenBao secret/data/messaging/rabbitmq into the
# Kubernetes Secret messaging/rabbitmq-credentials that RabbitMQ already
# consumes via secretKeyRef. The Deployment stays unchanged.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: rabbitmq-credentials
  namespace: messaging
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: rabbitmq-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: RABBITMQ_DEFAULT_USER
      remoteRef:
        key: "messaging/rabbitmq"
        property: "RABBITMQ_DEFAULT_USER"
    - secretKey: RABBITMQ_DEFAULT_PASS
      remoteRef:
        key: "messaging/rabbitmq"
        property: "RABBITMQ_DEFAULT_PASS"
