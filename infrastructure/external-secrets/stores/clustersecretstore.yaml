---
# ClusterSecretStore: connects External Secrets Operator to OpenBao.
# Uses Kubernetes auth with the k8s-eso-reader role (created by OpenBao bootstrap/apply scripts).
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: "http://openbao.openbao.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "k8s-eso-reader"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
