---
# ClusterSecretStore: connects External Secrets Operator to OpenBao.
# Uses Kubernetes auth with the eso-reader role (created by openbao-bootstrap.sh).
# The CA certificate ConfigMap is also created by openbao-bootstrap.sh.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: "https://openbao.openbao.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-reader"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
      caProvider:
        type: "ConfigMap"
        name: "openbao-ca-cert"
        key: "ca.crt"
        namespace: "external-secrets"
