apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - helmrepository.yaml
  - helmrelease.yaml
  - default-deny-ingress.yaml

# Intentionally exclude stores/ from the default infrastructure phase.
# ClusterSecretStore and ExternalSecret depend on manual OpenBao init/unseal,
# Kubernetes auth bootstrap, and the RabbitMQ secret being written to OpenBao.
# Apply after running scripts/openbao/bootstrap.sh and
# scripts/openbao/store-rabbitmq.sh:
#   kubectl apply -k infrastructure/external-secrets/stores
