apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - helmrepository.yaml
  - helmrelease.yaml
  - networkpolicy.yaml
  - default-deny-ingress.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: openbao-values
    namespace: openbao
    files:
      - values.yaml
