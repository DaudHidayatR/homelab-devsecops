apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 30m
  timeout: 10m
  install:
    disableWait: true
  upgrade:
    disableWait: true
  chart:
    spec:
      chart: openbao
      version: "0.26.2"
      sourceRef:
        kind: HelmRepository
        name: openbao
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: openbao-values
      valuesKey: values.yaml
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: openbao
            patch: |-
              apiVersion: v1
              kind: Service
              metadata:
                name: openbao
                annotations:
                  tailscale.com/expose: "true"
                  tailscale.com/serve: "true"
