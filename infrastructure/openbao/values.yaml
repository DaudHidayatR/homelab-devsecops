# OpenBao Helm chart values — single-node raft (dev/lab)
# NOTE: This file is the Flux HelmRelease values source.
# Keep OpenBao chart settings here to avoid values drift.
# Fresh install only, no migration
# Chart repo: openbao/openbao

global:
  tlsDisable: false

injector:
  enabled: false

csi:
  enabled: false

server:
  image:
    tag: "2.5.2"

  service:
    # NOTE: Do NOT add tailscale.com/expose or tailscale.com/serve here!
    # The OpenBao Helm chart applies server.service.annotations to ALL
    # services it creates (openbao, openbao-active, openbao-standby,
    # openbao-internal, openbao-ui), causing Tailscale operator to create
    # duplicate proxy pods for each. Instead, annotate only the main
    # 'openbao' Service manually after deployment:
    #   kubectl annotate svc openbao -n openbao tailscale.com/expose=true tailscale.com/serve=true
    annotations: {}

  updateStrategyType: RollingUpdate

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  ingress:
    enabled: false

  readinessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
    port: 8200
    scheme: HTTPS
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 12
    timeoutSeconds: 3

  livenessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true"
    port: 8200
    scheme: HTTPS
    initialDelaySeconds: 60
    periodSeconds: 10
    failureThreshold: 6
    timeoutSeconds: 5

  dataStorage:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce

  auditStorage:
    enabled: false

  standalone:
    enabled: false

  volumes:
    - name: tls
      secret:
        secretName: openbao-tls
  volumeMounts:
    - name: tls
      mountPath: /vault/userconfig/tls
      readOnly: true

  ha:
    enabled: true
    replicas: 1
    raft:
      enabled: true
      setNodeId: true
    config: |
      ui = true

      listener "tcp" {
        tls_disable = 0
        address = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_cert_file = "/vault/userconfig/tls/tls.crt"
        tls_key_file = "/vault/userconfig/tls/tls.key"
      }

      storage "raft" {
        path = "/vault/data"
      }

ui:
  enabled: true
