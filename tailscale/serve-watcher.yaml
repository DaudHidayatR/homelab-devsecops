---
# ServiceAccount for the tailscale-serve-watcher
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale-serve-watcher
  namespace: tailscale
---
# ClusterRole for reading services in all namespaces (to determine target port)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tailscale-serve-watcher
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
# Role for accessing proxy pods
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale-serve-watcher
  namespace: tailscale
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["get", "list", "create"]
---
# ClusterRoleBinding for service read access
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tailscale-serve-watcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tailscale-serve-watcher
subjects:
  - kind: ServiceAccount
    name: tailscale-serve-watcher
    namespace: tailscale
---
# RoleBinding for pod access
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale-serve-watcher
  namespace: tailscale
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tailscale-serve-watcher
subjects:
  - kind: ServiceAccount
    name: tailscale-serve-watcher
    namespace: tailscale
---
# Deployment that continuously ensures tailscale serve is configured on proxy pods
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-serve-watcher
  namespace: tailscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tailscale-serve-watcher
  template:
    metadata:
      labels:
        app: tailscale-serve-watcher
    spec:
      serviceAccountName: tailscale-serve-watcher
      containers:
        - name: watcher
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting tailscale serve watcher..."
              while true; do
                echo "$(date -Iseconds) Checking proxy pods..."
                # Find all proxy pods managed by the tailscale operator
                for POD in $(kubectl get pods -n tailscale \
                  -l tailscale.com/managed=true,tailscale.com/parent-resource-type=svc \
                  -o name 2>/dev/null | grep -v operator); do
                  POD_NAME=$(basename "$POD")
                  echo "  Checking $POD_NAME..."

                  # Check if serve is configured
                  SERVE_STATUS=$(kubectl exec -n tailscale "$POD_NAME" -c tailscale -- \
                    tailscale serve status 2>/dev/null || true)

                  if echo "$SERVE_STATUS" | grep -q "https://"; then
                    echo "  ✓ $POD_NAME already configured"
                    continue
                  fi

                  echo "  Configuring $POD_NAME..."

                  # Get the target IP from environment
                  DEST_IP=$(kubectl exec -n tailscale "$POD_NAME" -c tailscale -- \
                    sh -c 'echo $TS_DEST_IP' 2>/dev/null || true)
                  if [ -z "$DEST_IP" ]; then
                    echo "  ✗ Could not get TS_DEST_IP for $POD_NAME"
                    continue
                  fi

                  # Get parent service info
                  PARENT_SVC=$(kubectl get pod -n tailscale "$POD_NAME" \
                    -o jsonpath='{.metadata.labels.tailscale\.com/parent-resource}' 2>/dev/null || true)
                  PARENT_NS=$(kubectl get pod -n tailscale "$POD_NAME" \
                    -o jsonpath='{.metadata.labels.tailscale\.com/parent-resource-ns}' 2>/dev/null || true)
                  if [ -z "$PARENT_SVC" ] || [ -z "$PARENT_NS" ]; then
                    echo "  ✗ Could not get parent service for $POD_NAME"
                    continue
                  fi

                  TARGET_PORT=$(kubectl get svc -n "$PARENT_NS" "$PARENT_SVC" \
                    -o jsonpath='{.spec.ports[0].port}' 2>/dev/null || true)
                  if [ -z "$TARGET_PORT" ]; then
                    echo "  ✗ Could not get target port for $PARENT_SVC"
                    continue
                  fi

                  BACKEND_URL="http://${DEST_IP}:${TARGET_PORT}"
                  echo "    Backend: $BACKEND_URL"

                  kubectl exec -n tailscale "$POD_NAME" -c tailscale -- \
                    tailscale serve --bg --set-path / "$BACKEND_URL" 2>&1 || true
                  echo "  ✓ Configured $POD_NAME"
                done
                echo "$(date -Iseconds) Check complete, sleeping 300s..."
                sleep 300
              done
      resources:
        requests:
          memory: "64Mi"
          cpu: "50m"
        limits:
          memory: "128Mi"
          cpu: "200m"
