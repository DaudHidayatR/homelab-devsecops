apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 30m
  path: ./apps
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: nginx
      namespace: demo
    - apiVersion: apps/v1
      kind: Deployment
      name: rabbitmq
      namespace: messaging
    - apiVersion: apps/v1
      kind: Deployment
      name: headlamp
      namespace: kube-system
