# Example config for auto-purge-secret.sh
# Copy this file and customize it for your repository.
# Usage: ./scripts/auto-purge-secret.sh --config ./my-purge-config.toml

# Specific files to purge from Git history
secret_files = [
  "config/credentials.json",
  ".env.production",
]

# Regex patterns to match files in Git history
secret_patterns = [
  ".*secret.*",
  ".*credential.*",
  ".*password.*",
  ".*key.*\\.pem",
  ".*\\.env$",
]

# Custom backup directory (optional)
# backup_dir = "/mnt/backups/git-purge"

# Auto-confirm all prompts (use with caution!)
auto_confirm = false

# Automatically re-sign commits after purge
re_sign = true
